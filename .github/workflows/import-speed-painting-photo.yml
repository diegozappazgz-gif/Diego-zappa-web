name: Publish Speed Painting artwork
on:
  push:
    paths:
      - 'images/speed-painting/miguel-hernandez-speed-painting.avif.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode photo from safe temporary file
        shell: bash
        run: |
          base64 --decode images/speed-painting/miguel-hernandez-speed-painting.avif.b64 > images/speed-painting/miguel-hernandez-speed-painting.avif
          test "$(wc -c < images/speed-painting/miguel-hernandez-speed-painting.avif)" -gt 18000
          file images/speed-painting/miguel-hernandez-speed-painting.avif | grep -Ei 'AVIF|ISO Media' 
      - name: Commit permanent media and remove transfer file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/speed-painting/miguel-hernandez-speed-painting.avif
          git rm images/speed-painting/miguel-hernandez-speed-painting.avif.b64
          git commit -m "Publish Miguel Hernandez Speed Painting photograph"
          git push
