name: Import Speed Painting photograph
on:
  workflow_dispatch:
    inputs:
      photo_url:
        description: 'Temporary URL for the original event photo'
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original JPEG
        shell: bash
        env:
          PHOTO_URL: ${{ inputs.photo_url }}
        run: |
          mkdir -p images/speed-painting
          curl --fail --location --retry 3 --silent --show-error "$PHOTO_URL" -o images/speed-painting/miguel-hernandez-speed-painting.jpg
          test "$(wc -c < images/speed-painting/miguel-hernandez-speed-painting.jpg)" -gt 150000
          file images/speed-painting/miguel-hernandez-speed-painting.jpg | grep -q JPEG
      - name: Save photograph to main branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/speed-painting/miguel-hernandez-speed-painting.jpg
          git commit -m "Add Miguel Hernandez original Speed Painting photograph" || exit 0
          git push
